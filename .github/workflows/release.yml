name: Release

# A `v*` tag is the only path that publishes a GitHub release. macos.yml
# does not run on tags, so this job owns the signed DMG.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: Sign, notarize, publish
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      # Bake `v1.0.0-beta.9-mac.3` into the binary, Info.plist, and DMG name
      # so the in-app update check can see this build as current.
      - name: Version from the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          echo "LIGHTFORGE_VERSION=${tag}" >> "$GITHUB_ENV"
          echo "release version ${tag}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Lint the signing script
        run: bash -n packaging/macos/sign.sh

      - name: Test
        run: cargo test --workspace --locked

      - name: Release binaries
        run: cargo build --release --locked --bins

      - name: Assemble .app
        run: packaging/macos/bundle.sh target/release target/dist

      - name: Sign
        id: sign
        run: packaging/macos/sign.sh sign target/dist/Lightforge.app

      - name: Smoke the bundle
        run: |
          set -euo pipefail
          app=target/dist/Lightforge.app
          "$app/Contents/MacOS/lightforge-gui" --version
          "$app/Contents/MacOS/lightforge" --version
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

      - name: Resolve wowf from Blizzard and fetch a small file
        run: |
          set -euo pipefail
          cli=target/dist/Lightforge.app/Contents/MacOS/lightforge
          "$cli" update-check --product wowf --region us
          tmp="$(mktemp -d)"
          "$cli" plan "$tmp" --product wowf --region us --os osx --cpu arm64 --limit-archives 1 | tee "$tmp/plan.txt"
          grep -E 'tags[[:space:]]+OSX' "$tmp/plan.txt"
          grep -E 'flavor[[:space:]]+_forever_' "$tmp/plan.txt"
          grep -E 'executable[[:space:]]+World of Warcraft.app' "$tmp/plan.txt"
          "$cli" cdn-fetch --product wowf --region us --kind config

      - name: Package DMG
        run: packaging/macos/dmg.sh target/dist/Lightforge.app

      - name: Mount DMG and smoke the app
        run: |
          set -euo pipefail
          dmg="$(ls target/dist/Lightforge-*-arm64.dmg | head -1)"
          test -f "$dmg"
          mount="$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/[^[:space:]]*' | tail -1)"
          test -n "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          test -d "$mount/Lightforge.app"
          test -L "$mount/Applications"
          "$mount/Lightforge.app/Contents/MacOS/lightforge-gui" --version

      - name: Notarize
        id: notarize
        run: |
          set -euo pipefail
          dmg="$(ls target/dist/Lightforge-*-arm64.dmg | head -1)"
          packaging/macos/sign.sh notarize target/dist/Lightforge.app "$dmg"

      - name: Checksums
        run: |
          set -euo pipefail
          cd target/dist
          shasum -a 256 Lightforge-*-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') || contains(github.ref, 'alpha') }}
          files: |
            target/dist/Lightforge-*-arm64.dmg
            target/dist/SHA256SUMS.txt
          body: |
            macOS Apple Silicon build of Lightforge.

            - Signing: `${{ steps.sign.outputs.method }}`
            - Notarized: `${{ steps.notarize.outputs.notarized }}`

            Open the DMG and drag **Lightforge** to Applications.

            A notarized Developer ID build opens normally. An ad-hoc
            fallback (signing secrets missing) needs right-click → Open
            the first time, or:

            ```
            xattr -dr com.apple.quarantine /Applications/Lightforge.app
            ```

            It downloads the native macOS arm64 World of Warcraft: Forever
            client (`wowf`, OSX tags) and launches `World of Warcraft.app`
            directly. Login is the in-game Battle.net window.

      - name: Cleanup keychain
        if: always()
        run: packaging/macos/sign.sh cleanup
