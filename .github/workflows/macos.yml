name: macOS

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: Build, test, DMG
    # macos-14 retired 2026-11-02; GitHub cancels it with
    # "The configuration 'macos-14-arm64-us-default' is not supported".
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Lint the signing script
        run: bash -n packaging/macos/sign.sh

      - name: Test
        run: cargo test --workspace --locked

      - name: Release binaries
        run: cargo build --release --locked --bins

      - name: Assemble .app
        run: packaging/macos/bundle.sh target/release target/dist

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - target/dist/Lightforge.app
          codesign --verify --verbose target/dist/Lightforge.app

      - name: Smoke the bundle
        run: |
          set -euo pipefail
          app=target/dist/Lightforge.app
          "$app/Contents/MacOS/lightforge-gui" --version
          "$app/Contents/MacOS/lightforge" --version
          "$app/Contents/MacOS/lightforge" fixup --help | grep -F 'CASC store'
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

      - name: Resolve wowf from Blizzard and fetch a small file
        run: |
          set -euo pipefail
          cli=target/dist/Lightforge.app/Contents/MacOS/lightforge
          "$cli" update-check --product wowf --region us
          tmp="$(mktemp -d)"
          "$cli" plan "$tmp" --product wowf --region us --os osx --cpu arm64 --limit-archives 1 | tee "$tmp/plan.txt"
          grep -E 'tags[[:space:]]+OSX' "$tmp/plan.txt"
          grep -E 'flavor[[:space:]]+_forever_' "$tmp/plan.txt"
          grep -E 'executable[[:space:]]+World of Warcraft.app' "$tmp/plan.txt"
          grep -E 'wanted[[:space:]]+[1-9][0-9]* files' "$tmp/plan.txt"
          "$cli" cdn-fetch --product wowf --region us --kind config

      - name: Package DMG
        run: packaging/macos/dmg.sh target/dist/Lightforge.app

      - name: Mount DMG and smoke the app
        run: |
          set -euo pipefail
          dmg="$(ls target/dist/Lightforge-*-arm64.dmg | head -1)"
          test -f "$dmg"
          mount="$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/[^[:space:]]*' | tail -1)"
          test -n "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          ls -la "$mount"
          test -d "$mount/Lightforge.app"
          test -L "$mount/Applications"
          "$mount/Lightforge.app/Contents/MacOS/lightforge-gui" --version
          "$mount/Lightforge.app/Contents/MacOS/lightforge" --version

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lightforge-macos-arm64
          path: target/dist/Lightforge-*-arm64.dmg
          if-no-files-found: error

      # upload-artifact of a .app directory drops the wrapper. Zip it
      # only when the sign job will run (never on pull_request).
      - name: Zip the .app for signing
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: ditto -c -k --keepParent target/dist/Lightforge.app target/dist/Lightforge.app.zip

      - name: Upload .app zip
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Lightforge-app
          path: target/dist/Lightforge.app.zip
          if-no-files-found: error

  # Developer ID + notarization. Secrets live on the `release` environment
  # and are never exposed to pull_request (including forks). Missing
  # secrets fall back to ad-hoc signing and do not fail the job.
  sign:
    name: Sign and notarize
    needs: macos
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Lightforge-app
          path: target/dist

      - name: Unpack .app
        run: |
          set -euo pipefail
          ditto -x -k target/dist/Lightforge.app.zip target/dist
          test -d target/dist/Lightforge.app

      - name: Sign
        id: sign
        run: packaging/macos/sign.sh sign target/dist/Lightforge.app

      - name: Package DMG
        run: packaging/macos/dmg.sh target/dist/Lightforge.app

      - name: Notarize
        id: notarize
        run: |
          set -euo pipefail
          dmg="$(ls target/dist/Lightforge-*-arm64.dmg | head -1)"
          packaging/macos/sign.sh notarize target/dist/Lightforge.app "$dmg"

      - name: Cleanup keychain
        if: always()
        run: packaging/macos/sign.sh cleanup

      - name: Upload signed DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lightforge-macos-arm64-signed
          path: target/dist/Lightforge-*-arm64.dmg
          if-no-files-found: error
